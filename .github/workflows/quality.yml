name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epf-source
  cancel-in-progress: true

jobs:
  plan:
    runs-on: macos-15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Assign every actual integration target
        id: plan
        run: |
          set -euo pipefail
          printf 'matrix=%s\n' "$(sh tools/check.sh plan)" >> "$GITHUB_OUTPUT"

  validate:
    needs: plan
    runs-on: macos-15
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    timeout-minutes: ${{ matrix.stage == 'miri-unit' && 45 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the stable compiler
        run: rustup toolchain install stable --profile minimal
      - name: Install native checks and the embedded target
        if: matrix.stage == 'native'
        run: |
          rustup component add rustfmt clippy --toolchain stable
          rustup target add thumbv6m-none-eabi --toolchain stable
      - name: Install the pinned memory checker
        if: matrix.stage != 'native'
        run: rustup toolchain install "$(cat tools/miri-toolchain)" --profile minimal --component miri --component rust-src
      - name: Install the selected core's Lean compiler
        if: matrix.stage == 'native'
        shell: bash
        run: |
          set -euo pipefail
          core_manifest="$(cargo +stable metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "hibana") | .manifest_path')"
          toolchain="$(cat "$(dirname "$core_manifest")/proofs/lean/lean-toolchain")"
          case "$(uname -m)" in
            arm64|aarch64)
              elan_asset=elan-aarch64-apple-darwin.tar.gz
              elan_hash=7cae4c03b2f0de4053fb04a91359d5804551e6e37a6ddd1b2e0097dc561ae4a9
              ;;
            x86_64)
              elan_asset=elan-x86_64-apple-darwin.tar.gz
              elan_hash=10d037a69731c0593723e018130c5f54afde175796b4af8ba1317e561e55598c
              ;;
            *) exit 1 ;;
          esac
          epf_elan_tmp="$(mktemp -d)"
          trap 'rm -r -- "$epf_elan_tmp"' EXIT
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/leanprover/elan/releases/download/v4.2.3/$elan_asset" \
            -o "$epf_elan_tmp/elan.tar.gz"
          printf '%s  %s\n' "$elan_hash" "$epf_elan_tmp/elan.tar.gz" | shasum -a 256 --check
          tar -xzf "$epf_elan_tmp/elan.tar.gz" -C "$epf_elan_tmp"
          "$epf_elan_tmp/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" run --install "$toolchain" lean --version
      - name: Check the selected validation stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          core_manifest="$(cargo +stable metadata --locked --format-version 1 | jq -er '[.packages[] | select(.name == "hibana") | .manifest_path] | if length == 1 then .[0] else error("expected exactly one core") end')"
          bash "$(dirname "$core_manifest")/.github/scripts/lib/resource_guard.sh" \
            sh tools/check.sh "${{ matrix.stage }}" 2>&1 | tee "target/validation-${{ matrix.stage }}.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: epf-${{ matrix.stage }}
          path: |
            target/validation-${{ matrix.stage }}.log
            target/commit-observation-proof/
            target/history-sensitivity/

  required:
    name: epf-contract
    if: always()
    needs: [plan, validate]
    runs-on: macos-15
    steps:
      - name: Require the complete validation matrix
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          printf '%s\n' "$RESULTS" |
          jq -e 'keys == ["plan", "validate"] and all(.[]; .result == "success")'
