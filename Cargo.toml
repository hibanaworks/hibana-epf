[package]
name = "hibana-epf"
version = "0.1.0"
edition = "2024"
description = "EPF verifier and bytecode appliance for hibana"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hibanaworks/hibana-epf"
homepage = "https://github.com/hibanaworks/hibana-epf"
documentation = "https://docs.rs/hibana-epf"
readme = "README.md"

[features]
default = []
std = []

[dependencies]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "8792e63a067fea2d1acff45a66ba77fb5ec647a0", version = "=0.10.0", default-features = false }

[[bin]]
name = "hibana-epf"
path = "src/bin/hibana-epf.rs"
required-features = ["std"]

[lints.rust]
long_running_const_eval = "forbid"
unsafe_op_in_unsafe_fn = "deny"
