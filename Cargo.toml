[package]
name = "hibana-epf"
version = "0.1.0"
edition = "2024"
description = "Dynamic observation and resolver policies for Hibana"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hibanaworks/hibana-epf"
documentation = "https://docs.rs/hibana-epf"
readme = "README.md"

[features]
default = []
std = []

[dependencies]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "9b8a3b34409c50c9658f87f8d7fb6208e93b5d43", version = "=0.10.0", default-features = false }

[[bin]]
name = "hibana-epf"
path = "src/bin/hibana-epf.rs"
required-features = ["std"]

[lints.rust]
long_running_const_eval = "forbid"
unsafe_op_in_unsafe_fn = "deny"
